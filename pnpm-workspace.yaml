packages:
  - apps/*
  # examples/* is intentionally NOT a workspace member: the example apps are
  # gitignored, local-only scratch apps. Keeping them in the workspace glob
  # wrote their importers into the committed lockfile, which CI (without the
  # gitignored examples) could not reconcile. Re-enable locally only while
  # iterating against example apps, and do not commit the resulting lockfile.
  # - examples/*
  - packages/*
  - tooling/*
  - templates/*
allowBuilds:
  esbuild: false
  msw: false
  sharp: false

auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
overrides:
  # Security fixes for transitive dependencies. Only the entries still
  # load-bearing are kept — verified with `pnpm dlx pnpm-override-prune`, which
  # drops any whose floor the natural resolution already satisfies. Re-run that
  # after dependency upgrades to prune newly-stale entries.
  #
  # linkify-it <=5.0.1: quadratic-complexity DoS (GHSA-22p9-wv53-3rq4, GHSA-v245-v573-v5vm)
  linkify-it: ">=5.0.2"
  # @azure/msal-node <7.1.0: transitive MSAL advisory
  "@azure/msal-node": ">=7.1.0"
  # postcss-selector-parser <7.1.6
  postcss-selector-parser: ">=7.1.6"
permissions:
  cleye:
    skills: false
  ultracite:
    skills: false
