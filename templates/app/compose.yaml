services:
  app:
    build: .
    ports:
      - "4000:4000"
    # Load every variable from .env into the container. This covers the
    # data-source and auth variables your lakeql.config.ts reads (FABRIC_*,
    # OBO_*, AUTH_*, …) without listing them here, so it never drifts as you
    # add data sources. Copy .env.example to .env and fill in the values.
    env_file:
      - .env
    # Fixed values that should not depend on .env. `environment` takes
    # precedence over `env_file`, so these always win.
    environment:
      - NODE_ENV=production
      - API_PORT=4000
    restart: unless-stopped
