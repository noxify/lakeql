# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Policy: Dependabot proposes MINOR + PATCH updates only, grouped into one PR
# per ecosystem. Major bumps are ignored here and handled manually (with a
# Tegami changeset + review). Dep-bump PRs never need a `.tegami/` changeset:
# releases go through the separate Tegami version PR, so merging a bump to
# `main` does not cut a release. The companion workflow
# `.github/workflows/dependabot-auto-merge.yml` auto-merges these PRs once the
# required status checks on `main` pass (branch protection is the real gate).
version: 2

updates:
  # npm / pnpm workspace (pnpm maps to package-ecosystem "npm"). One combined
  # PR for ALL npm deps (dev + prod); majors are ignored, so every npm PR here
  # is minor/patch and auto-merge-eligible.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/examples/*"
      - "/packages/*"
      - "/tooling/*"
      - "/templates/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # No major bumps via Dependabot — handled by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"

  # GitHub Actions — keep workflow action pins current (minor/patch, grouped).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Python / uv — vendored minitrino tooling. No changeset needed. Uses the
  # native "uv" ecosystem (reads pyproject.toml + uv.lock), not "pip".
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      uv-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
