name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/setup

      - name: Build packages
        run: pnpm build:pkg

      - name: Version & publish packages
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC trusted publishing is preferred, but it cannot be configured
          # for a package that does not exist on npm yet. This token covers the
          # first publish (and acts as a fallback); once packages exist and
          # trusted publishing is set up, OIDC takes over and this is unused.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
