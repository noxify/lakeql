name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "tegami/version-packages"]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run CI for"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/setup

      - name: Generate next routes
        run: pnpm -F docs typegen

      - name: Lint
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/setup

      - name: Generate next routes
        run: pnpm -F docs typegen

      - name: Build packages
        run: pnpm build:pkg

      - name: Typecheck
        run: pnpm typecheck

  detect-package-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      packages_changed: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'pnpm-lock.yaml'

  pkg-new-release:
    needs: [lint, format, typecheck, detect-package-changes]
    if: github.event_name == 'pull_request' && needs.detect-package-changes.outputs.packages_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/setup

      - name: Build
        env:
          LAKEQL_TEMPLATE_REF: ${{ github.event.pull_request.head.ref }}
          LAKEQL_PKG_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm build:pkg

      - name: Publish packages
        id: publish
        run: pnpm exec pkg-pr-new publish --commentWithSha --packageManager=pnpm --json output.json --comment=off ./packages/*

      - name: Post or update preview comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            let output;
            try {
              output = JSON.parse(fs.readFileSync("output.json", "utf8"));
            } catch (error) {
              core.setFailed(`Unable to read pkg-pr-new output.json: ${error.message}`);
              return;
            }

            const packages = Array.isArray(output.packages) ? output.packages : [];

            const createAppPackage = packages.find((pkg) => pkg.name === "@lakeql/create-app");

            const identifier = "<!-- lakeql-pkg-pr-new-comment -->";

            const sections = [identifier, "## \ud83d\udce6 LakeQL preview build"];

            if (createAppPackage) {
              const createAppLines = [
                "### \ud83d\ude80 Try `create-app`",
                "",
                "This preview build includes `@lakeql/create-app`. Scaffold a new app with it:",
                "",
                "```sh",
                `pnpm dlx --config.block-exotic-subdeps=false ${createAppPackage.url} my-app`,
                "```",
                "",
                "> The `--config.block-exotic-subdeps=false` flag is required because create-app's own `@lakeql/scaffold` dependency resolves to a pkg.pr.new URL, which recent pnpm versions block as an exotic subdependency by default.",
              ];
              sections.push(createAppLines.join("\n"));
            }

            if (packages.length > 0) {
              const packageBlocks = packages.map((pkg) =>
                [
                  "<details>",
                  `<summary><b>${pkg.name}</b></summary>`,
                  "",
                  "```sh",
                  `pnpm add ${pkg.url}`,
                  "```",
                  "",
                  "</details>",
                ].join("\n"),
              );
              sections.push(["### \ud83d\udce5 Packages", "", ...packageBlocks].join("\n"));
            }

            const headSha =
              (context.payload.pull_request && context.payload.pull_request.head.sha) ||
              context.sha;
            const shortSha = headSha ? headSha.slice(0, 7) : "";
            if (headSha) {
              const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${headSha}`;
              sections.push(`_commit: [\`${shortSha}\`](${commitUrl})_`);
            }

            const body = sections.join("\n\n");

            const issueNumber = context.issue.number;

            if (!issueNumber) {
              console.log("No associated pull request. Skipping preview comment.");
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existingComment = comments.find((comment) => comment.body && comment.body.includes(identifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
