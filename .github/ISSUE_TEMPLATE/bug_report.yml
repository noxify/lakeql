name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the sections below.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "I don't know"
        - adapters
        - api
        - cli
        - column-parser
        - create-app
        - file-generator
        - helpers
        - logger
        - parquet
        - query-builder
        - response-transformer
        - schema-generator
        - trino-client
        - documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### StackBlitz Reproduction Templates

        If possible, please provide a minimal reproduction using one of our StackBlitz templates:

        | Package | StackBlitz |
        |---------|-----------|
        | Generic (all packages) | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/generic) |
        | column-parser | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/column-parser) |
        | helpers | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/helpers) |
        | logger | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/logger) |
        | parquet | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/parquet) |
        | query-builder | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/query-builder) |
        | response-transformer | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/response-transformer) |
        | schema-generator | [Open](https://stackblitz.com/fork/github/noxify/lakeql/tree/main/templates/stackblitz/schema-generator) |

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior. If you created a StackBlitz reproduction, paste the URL here.
      placeholder: |
        1. Install package...
        2. Run command...
        3. See error...

        StackBlitz reproduction: https://stackblitz.com/...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide relevant environment details.
      placeholder: |
        - OS: macOS 14.x / Ubuntu 22.04 / Windows 11
        - Node.js: 20.x
        - Package version: x.x.x
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs that might help.
      placeholder: Add any other context here...
    validations:
      required: false
