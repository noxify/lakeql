; Vale configuration for the LakeQL docs.
; Run with: pnpm --filter docs lint:prose   (or: pnpm exec vale content)
; Rule packages are pulled by `vale sync` into StylesPath before the first run.

StylesPath = .vale/styles
; Default to warning so routine suggestions (passive voice, acronym spell-outs,
; long sentences) do not drown the signal. Raise visibility ad hoc with
; `vale --minAlertLevel suggestion content` when doing a thorough prose review.
MinAlertLevel = warning

; Accept LakeQL product terms, package names, and API symbols as correctly
; spelled. Lives in .vale/styles/config/vocabularies/LakeQL/accept.txt.
Vocab = LakeQL

; The Google package implements the Google Developer Documentation Style Guide.
; `vale sync` downloads it into StylesPath.
Packages = Google

; Content is MDX. Vale treats it as Markdown and parses the embedded JSX/HTML.
[*.{md,mdx}]
; Vale's generic spell-checker and term-casing rules fight technical docs full
; of code tokens, acronyms, and API symbols, producing mostly false positives.
; We rely on the Vocab for accepted terms and on Google + LakeQL for style, not
; on Vale.Spelling/Vale.Terms. Base on Google + LakeQL only.
BasedOnStyles = Google, LakeQL

; --- Scope control for our MDX ---------------------------------------------
; Skip fenced code blocks and inline code entirely (Vale does this for the
; `code`/`pre` scopes by default via the Markdown parser, but we also drop
; our custom component props and self-contained component blocks so Vale does
; not lint JSX attribute strings as prose.

; Ignore the contents of block-level MDX components that carry no prose we want
; linted as sentences (tables, file trees, command subjects, generated refs).
BlockIgnores = (?s) *(<CliCommandDetails.*?/>)
BlockIgnores = (?s) *(<ApiReference.*?/>)
BlockIgnores = (?s) *(<Command.*?</Command>)
BlockIgnores = (?s) *(<FileTree[^>]*/>)
BlockIgnores = (?s) *(<PageList[^>]*/>)
BlockIgnores = (?s) *(<Terminal.*?</Terminal>)

; Ignore JSX expression braces and component tag lines so attribute values are
; not linted as sentences.
TokenIgnores = (<[A-Z][A-Za-z]+\b[^>]*>), (</[A-Z][A-Za-z]+>)

; --- Rules that fight intentional LakeQL conventions ------------------------
; Headings use Title Case by project convention (and heading text derives the
; anchor IDs cross-page links depend on). Do not enforce sentence-case headings.
Google.Headings = NO
; Keep the even, formal reference tone; do not force contractions.
Google.Contractions = NO
; "(s)" plurals and parentheses are used deliberately in a few option tables.
Google.Parens = NO
; Google.EmDash flags every em-dash. We keep legitimate em-dashes in tables and
; "term — definition" rows; our own Prose Style rule governs insertion-clause
; dashes semantically, which a regex cannot distinguish. Disable the blanket check.
Google.EmDash = NO
