core:changelogs:
  - content: "---\npackages:\n  npm:@lakeql/adapter-fabric:\n    type: patch\n  npm:@lakeql/adapter-trino:\n    type: patch\n  npm:@lakeql/api:\n    type: patch\n  npm:@lakeql/cli:\n    type: patch\n  npm:@lakeql/column-parser:\n    type: patch\n  npm:@lakeql/config:\n    type: patch\n  npm:@lakeql/create-app:\n    type: patch\n  npm:@lakeql/datasource:\n    type: patch\n  npm:@lakeql/fabric-client:\n    type: patch\n  npm:@lakeql/file-generator:\n    type: patch\n  npm:@lakeql/helpers:\n    type: patch\n  npm:@lakeql/logger:\n    type: patch\n  npm:@lakeql/parquet:\n    type: patch\n  npm:@lakeql/query-builder:\n    type: patch\n  npm:@lakeql/response-transformer:\n    type: patch\n  npm:@lakeql/scaffold:\n    type: patch\n  npm:@lakeql/schema-generator:\n    type: patch\n  npm:@lakeql/sql-read-strategy:\n    type: patch\n  npm:@lakeql/storage:\n    type: patch\n  npm:@lakeql/trino-client:\n    type: patch\n---\n\n### Package metadata and publishing\n\nAdd READMEs for the packages that shipped without one, refine npm keywords (and drop the Trino-specific keyword from adapter-neutral packages), and re-publish every package through npm trusted publishing (OIDC) to validate the configuration. No runtime or API changes.\n"
    filename: 2026-11-08-readme-oidc.md
    v: 0.0.0
