core:changelogs:
  - content: "---\npackages:\n  \"@lakeql/adapter-fabric\":\n    type: major\n  \"@lakeql/adapter-trino\":\n    type: major\n  \"@lakeql/api\":\n    type: major\n  \"@lakeql/cli\":\n    type: major\n  \"@lakeql/column-parser\":\n    type: major\n  \"@lakeql/config\":\n    type: major\n  \"@lakeql/create-app\":\n    type: major\n  \"@lakeql/datasource\":\n    type: major\n  \"@lakeql/fabric-client\":\n    type: major\n  \"@lakeql/file-generator\":\n    type: major\n  \"@lakeql/helpers\":\n    type: major\n  \"@lakeql/logger\":\n    type: major\n  \"@lakeql/parquet\":\n    type: major\n  \"@lakeql/query-builder\":\n    type: major\n  \"@lakeql/response-transformer\":\n    type: major\n  \"@lakeql/scaffold\":\n    type: major\n  \"@lakeql/schema-generator\":\n    type: major\n  \"@lakeql/sql-read-strategy\":\n    type: major\n  \"@lakeql/storage\":\n    type: major\n  \"@lakeql/trino-client\":\n    type: major\n---\n\n### LakeQL 1.0 — first stable release on the adapter-based architecture\n\nThe 1.0 line is a ground-up restructure of the 0.x packages around a single adapter-based architecture: a neutral data-source/adapter contract, config + runtime composition, the Trino (read + write) and Fabric (read-only) adapters, the CLI (endpoint generation and `create-app`), and the GraphQL API layer.\n\nThis is a breaking release with no in-place upgrade path from the 0.x line — re-scaffold projects with `create-app` and re-author configuration against the 1.0 APIs rather than upgrading existing code.\n"
    filename: 2026-10-27-lakeql-1-0.md
    v: 0.0.0
